<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ffb6c1
                );

            transition: background 0.4s ease;
        }

        /* MAIN CARD */

        .card {
            width: 85%;
            max-width: 380px;

            padding: 35px 22px;

            background: rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.20);

            z-index: 5;
        }

        h1 {
            margin-top: 0;
            font-size: 34px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        /* BUTTON */

        button {
            border: none;

            padding: 15px 35px;

            border-radius: 30px;

            background: white;
            color: #ff416c;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 7px 20px rgba(0,0,0,0.20);

            cursor: pointer;

            transition: transform 0.15s;
        }

        button:active {
            transform: scale(0.90);
        }


        /* PRANK SCREEN */

        #prank {
            display: none;
        }

        .prank-mode {
            background:
                radial-gradient(
                    circle,
                    #252525,
                    #000000
                );
        }

        .boom {
            font-size: 65px;

            animation:
                boom 0.5s ease;
        }

        @keyframes boom {

            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }


        /* GLITCH TEXT */

        .glitch {
            font-size: 42px;
            font-weight: 900;

            color: #ff1744;

            text-shadow:
                3px 3px 0 white,
                -3px -3px 0 #00ffff;

            animation:
                glitch 0.15s infinite,
                shake 0.20s infinite;
        }

        @keyframes glitch {

            0% {
                transform: translate(0);
            }

            25% {
                transform: translate(6px, -3px);
            }

            50% {
                transform: translate(-6px, 3px);
            }

            75% {
                transform: translate(3px, 5px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes shake {

            0% {
                transform: translate(0);
            }

            25% {
                transform: translate(4px, -4px);
            }

            50% {
                transform: translate(-4px, 4px);
            }

            75% {
                transform: translate(4px, 4px);
            }

            100% {
                transform: translate(0);
            }
        }


        /* FLASH */

        .flash {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: white;

            z-index: 100;

            pointer-events: none;

            animation: flash 0.45s forwards;
        }

        @keyframes flash {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* FLOATING HEARTS */

        .heart {
            position: fixed;

            bottom: -50px;

            pointer-events: none;

            z-index: 2;

            animation:
                floatUp linear forwards;
        }

        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(1);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg)
                    scale(1.5);

                opacity: 0;
            }
        }

    </style>
</head>


<body>


    <!-- SWEET SCREEN -->

    <div class="card" id="sweet">

        <h1>
            💖 Hi...
        </h1>

        <p>
            I made something special for you. 🥺❤️
        </p>

        <p>
            Please click the button...
        </p>

        <br>

        <button onclick="startPrank()">
            START ❤️
        </button>

    </div>



    <!-- PRANK SCREEN -->

    <div class="card" id="prank">

        <div class="boom">
            💥
        </div>

        <h1 class="glitch">
          🖕 FUCK YOU BOI 😂
        </h1>

        <p>
            HAHAHAHAHAHA 😭🔥
        </p>

        <button onclick="resetPage()">
            TRY AGAIN 😂
        </button>

    </div>



    <script>

        /* CREATE HEARTS */

        function createHearts() {

            for (let i = 0; i < 30; i++) {

                const heart =
                    document.createElement("div");

                heart.className = "heart";

                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.fontSize =
                    (15 + Math.random() * 30) + "px";

                heart.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }



        /* START PRANK */

        function startPrank() {

            // Sweet hearts first
            createHearts();


            // Flash screen
            const flash =
                document.createElement("div");

            flash.className = "flash";

            document.body.appendChild(flash);


            // Hide sweet screen
            document.getElementById("sweet")
                .style.display = "none";


            // Dark mode
            document.body.classList
                .add("prank-mode");


            // Show prank
            setTimeout(() => {

                document.getElementById("prank")
                    .style.display = "block";

            }, 250);


            // Remove flash
            setTimeout(() => {

                flash.remove();

            }, 500);

        }



        /* RESET */

        function resetPage() {

            document.getElementById("prank")
                .style.display = "none";

            document.getElementById("sweet")
                .style.display = "block";

            document.body.classList
                .remove("prank-mode");

        }

    </script>

</body>
</html>
